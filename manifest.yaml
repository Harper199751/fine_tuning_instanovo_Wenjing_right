kind: AIchorManifest
apiVersion: 0.2.3
name: pxd059455-instanovo-finetune
builder:
  image: image
  dockerfile: ./Dockerfile
  context: .
spec:
  operator: pytorch
  image: image
  command: /app/scripts/run_pxd059455_aichor.sh
  timeout: 36h
  types:
    worker:
      count: 1
      resources:
        cpus: 16
        memory: 160
        shmSizeGB: 16
        accelerators:
          gpu:
            product: NVIDIA-H100-80GB-HBM3-MIG-3g.40gb
            type: gpu
            count: 1
  tensorboard:
    enabled: false
