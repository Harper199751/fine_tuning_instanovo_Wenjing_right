# Per-layer encoder-first gradual unfreeze (InstaNovo-P style), generated by
# scripts/04_make_training_overrides.py: head + embeddings, then encoder layers
# 8 -> 0, then decoder layers 8 -> 0, with phase start steps scaled to
# training_steps (=306 for the split this was generated from).
unfreeze_format: start_step
verbose: True
unfreeze_schedule:
  - start_step: 0
    params:
      - head.bias
      - head.weight
      - aa_embed.weight
  - start_step: 31
    params:
      - "peak_encoder.*"
      - "charge_encoder.*"
      - latent_spectrum
      - "encoder.layers.8.*"
  - start_step: 61
    params:
      - "encoder.layers.7.*"
      - "encoder.layers.6.*"
  - start_step: 92
    params:
      - "encoder.layers.5.*"
      - "encoder.layers.4.*"
  - start_step: 122
    params:
      - "encoder.layers.3.*"
      - "encoder.layers.2.*"
  - start_step: 153
    params:
      - "encoder.layers.1.*"
      - "encoder.layers.0.*"
  - start_step: 214
    params:
      - "decoder.layers.8.*"
      - "decoder.layers.7.*"
  - start_step: 245
    params:
      - "decoder.layers.6.*"
      - "decoder.layers.5.*"
      - "decoder.layers.4.*"
  - start_step: 275
    params:
      - "decoder.layers.3.*"
      - "decoder.layers.2.*"
      - "decoder.layers.1.*"
      - "decoder.layers.0.*"
